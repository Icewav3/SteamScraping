name: 🎮 IGDB Scraper

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Pin snapshot date
        run: echo "SCRAPE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install deps
        run: uv sync
      
      - name: Run scraper
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_PAGES: "50"
        run: |
          MAX_ATTEMPTS=4
          RETRY_DELAY=1800  # 30 minutes
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Scrape attempt $attempt/$MAX_ATTEMPTS ==="
            if uv run python -m src.IGDBScraper; then
              echo "✓ Scrape succeeded on attempt $attempt"
              exit 0
            fi
            echo "✗ Attempt $attempt failed"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Sleeping ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          echo "✗ All $MAX_ATTEMPTS attempts failed"
          exit 1
      
      - name: Upload to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DATE="$SCRAPE_DATE"
          
          # Create release if it doesn't exist (idempotent)
          if ! gh release view "$DATE" &>/dev/null; then
            echo "Creating release for $DATE"
            # Another workflow may create it in the same moment; that is fine
            # as long as the release exists afterwards.
            gh release create "$DATE" --title "Data for $DATE" --notes "Automated game data scraping for $DATE" \
              || gh release view "$DATE" &>/dev/null \
              || { echo "✗ Could not create or find release $DATE"; exit 1; }
          else
            echo "Release $DATE already exists"
          fi
          
          # Check if files exist before uploading
          if [ -d "Data/$DATE/IGDBScraper" ] && [ "$(ls -A Data/$DATE/IGDBScraper)" ]; then
            echo "Uploading IGDB data..."
            # Upload with --clobber to overwrite if needed
            for try in 1 2 3; do
              gh release upload "$DATE" Data/$DATE/IGDBScraper/* --clobber && break
              if [ "$try" -eq 3 ]; then echo "✗ Upload failed 3 times"; exit 1; fi
              echo "Upload attempt $try failed; retrying in 30s"; sleep 30
            done
            echo "✓ IGDB data uploaded successfully"
          else
            echo "No IGDB data to upload"
            exit 1
          fi

      - name: Keep data as a run artifact if anything failed
        # Runners are thrown away; this keeps the day recoverable for 30 days.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: Data/
          retention-days: 30
