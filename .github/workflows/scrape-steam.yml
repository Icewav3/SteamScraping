name: 🎮 Steam Scraper

on:
  schedule:
    # 2h after the SteamSpy run so the same-day appid list usually exists;
    # the newest-release fallback covers the day it doesn't yet.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~10k player lookups at 0.3s ≈ 1h (reviews are batched); room for retries.
    timeout-minutes: 300

    steps:
      - name: Pin snapshot date
        run: echo "SCRAPE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run scraper
        env:
          STEAM_API_DELAY: "0.3"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MAX_ATTEMPTS=4
          RETRY_DELAY=1800  # 30 minutes
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Scrape attempt $attempt/$MAX_ATTEMPTS ==="
            if uv run python -m src.SteamScraper; then
              echo "✓ Scrape succeeded on attempt $attempt"
              exit 0
            fi
            echo "✗ Attempt $attempt failed"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Sleeping ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          echo "✗ All $MAX_ATTEMPTS attempts failed"
          exit 1

      - name: Upload to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DATE="$SCRAPE_DATE"

          # Create release if it doesn't exist (idempotent)
          if ! gh release view "$DATE" &>/dev/null; then
            echo "Creating release for $DATE"
            # Another workflow may create it in the same moment; that is fine
            # as long as the release exists afterwards.
            gh release create "$DATE" --title "Data for $DATE" --notes "Automated game data scraping for $DATE" \
              || gh release view "$DATE" &>/dev/null \
              || { echo "✗ Could not create or find release $DATE"; exit 1; }
          else
            echo "Release $DATE already exists"
          fi

          # Check if files exist before uploading
          if [ -d "Data/$DATE/SteamScraper" ] && [ "$(ls -A Data/$DATE/SteamScraper)" ]; then
            echo "Uploading Steam data..."
            # Upload with --clobber to overwrite if needed
            for try in 1 2 3; do
              gh release upload "$DATE" Data/$DATE/SteamScraper/* --clobber && break
              if [ "$try" -eq 3 ]; then echo "✗ Upload failed 3 times"; exit 1; fi
              echo "Upload attempt $try failed; retrying in 30s"; sleep 30
            done
            echo "✓ Steam data uploaded successfully"
          else
            echo "No Steam data to upload"
            exit 1
          fi

      - name: Keep data as a run artifact if anything failed
        # Runners are thrown away; this keeps the day recoverable for 30 days.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: Data/
          retention-days: 30
