name: 🎮 SteamSpy Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Pin snapshot date
        # One date for the whole job: retries and the upload must agree on it,
        # even when a late-starting run crosses midnight UTC.
        run: echo "SCRAPE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run scraper
        env:
          STEAMSPY_PAGES: "10"
          STEAMSPY_PAGE_DELAY: "15"
          STEAMSPY_APP_DELAY: "0.1"
        run: |
          MAX_ATTEMPTS=4
          RETRY_DELAY=1800  # 30 minutes
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Scrape attempt $attempt/$MAX_ATTEMPTS ==="
            if uv run python -m src.SteamSpyScraper; then
              echo "✓ Scrape succeeded on attempt $attempt"
              exit 0
            fi
            echo "✗ Attempt $attempt failed"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Sleeping ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          echo "✗ All $MAX_ATTEMPTS attempts failed"
          exit 1
      
      - name: Upload to release
        # Branch runs never touch the dataset; their output lands in the run artifact.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/upload-release.sh "$SCRAPE_DATE" "Data/$SCRAPE_DATE/SteamSpyScraper" steamspy_data.jsonl

      - name: Keep data as a run artifact
        # Failed runs: keeps the day recoverable for 30 days. Branch runs: the only output.
        if: failure() || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: Data/
          retention-days: 30
